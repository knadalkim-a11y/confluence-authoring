<!--
PATTERN: distribution-percentile
Replace {{PREFIX}} with a unique alphanumeric-hyphen prefix.
Values below are illustrative until replaced with sourced data.
-->
<style>
.{{PREFIX}}{--ink:#172b43;--muted:#617287;--line:#dfe6ef;--blue:#6188c8;--purple:#7951b0;display:block;width:100%;max-width:960px;margin:0 auto;color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif}
.{{PREFIX}} *{box-sizing:border-box}
.{{PREFIX}} .box{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.{{PREFIX}} .head{padding:22px 24px 12px}
.{{PREFIX}} h3,.{{PREFIX}} p{margin:0}
.{{PREFIX}} .head p{margin-top:6px;color:var(--muted);font-size:13px}
.{{PREFIX}} .state{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important}
.{{PREFIX}} .tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 14px}
.{{PREFIX}} .tools label{border:1px solid #d7e0ec;border-radius:8px;padding:7px 11px;font-size:12px;cursor:pointer;background:#fff}
.{{PREFIX}} .stage{padding:0 24px 22px}
.{{PREFIX}} svg{display:block;width:100%;height:auto;background:#f8fafc;border:1px solid #e7edf4;border-radius:12px}
.{{PREFIX}} .grid{stroke:#dfe7f0;stroke-width:1}
.{{PREFIX}} .bar{fill:var(--blue);transform-box:fill-box;transform-origin:center bottom;transform:scaleY(1);--a:{{PREFIX}}-bars-a;--b:{{PREFIX}}-bars-b}
.{{PREFIX}} .tail{fill:var(--purple)}
.{{PREFIX}} .mean{opacity:1;--a:{{PREFIX}}-mean-a;--b:{{PREFIX}}-mean-b}
.{{PREFIX}} .p95{opacity:1;--a:{{PREFIX}}-p95-a;--b:{{PREFIX}}-p95-b}
.{{PREFIX}} .caption{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.6}
.{{PREFIX}} .anim{animation-name:var(--a);animation-duration:11s;animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:both}
.{{PREFIX}} .replay:checked~.stage .anim{animation-name:var(--b)}
.{{PREFIX}} .pause:checked~.stage .anim{animation-play-state:paused!important}
.{{PREFIX}} .still:checked~.stage .anim{animation:none!important}
@keyframes {{PREFIX}}-bars-a{0%,5%{transform:scaleY(0)}42%{transform:scaleY(1)}96%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes {{PREFIX}}-bars-b{0%,5%{transform:scaleY(0)}42%{transform:scaleY(1)}96%{transform:scaleY(1)}100%{transform:scaleY(0)}}
@keyframes {{PREFIX}}-mean-a{0%,46%{opacity:0}54%,96%{opacity:1}100%{opacity:0}}
@keyframes {{PREFIX}}-mean-b{0%,46%{opacity:0}54%,96%{opacity:1}100%{opacity:0}}
@keyframes {{PREFIX}}-p95-a{0%,67%{opacity:0}75%,96%{opacity:1}100%{opacity:0}}
@keyframes {{PREFIX}}-p95-b{0%,67%{opacity:0}75%,96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.{{PREFIX}} .anim{animation:none!important}.{{PREFIX}} .tools{display:none}}
@media print{.{{PREFIX}} .anim{animation:none!important}.{{PREFIX}} .tools{display:none}}
</style>
<div class="{{PREFIX}}" lang="ko">
<section class="box">
  <div class="head"><h3>{{TITLE}}</h3><p>{{DESCRIPTION}}</p></div>
  <input class="state pause" id="{{PREFIX}}-pause" type="checkbox" aria-label="애니메이션 일시정지">
  <input class="state replay" id="{{PREFIX}}-replay" type="checkbox" aria-label="애니메이션 처음부터 다시 재생">
  <input class="state still" id="{{PREFIX}}-still" type="checkbox" aria-label="최종 장면 표시">
  <div class="tools">
    <label for="{{PREFIX}}-pause">일시정지 / 계속</label>
    <label for="{{PREFIX}}-replay">처음부터</label>
    <label for="{{PREFIX}}-still">최종 장면</label>
  </div>
  <div class="stage">
    <svg viewBox="0 0 720 300" role="img" aria-labelledby="{{PREFIX}}-title">
      <title id="{{PREFIX}}-title">{{ACCESSIBLE_DESCRIPTION}}</title>
      <line class="grid" x1="55" y1="235" x2="685" y2="235"/>
      <line class="grid" x1="55" y1="170" x2="685" y2="170"/>
      <line class="grid" x1="55" y1="105" x2="685" y2="105"/>
      <rect class="bar anim" x="105" y="188" width="46" height="47" rx="3"/>
      <rect class="bar anim" x="175" y="132" width="46" height="103" rx="3"/>
      <rect class="bar anim" x="245" y="76" width="46" height="159" rx="3"/>
      <rect class="bar anim" x="315" y="120" width="46" height="115" rx="3"/>
      <rect class="bar anim" x="385" y="172" width="46" height="63" rx="3"/>
      <rect class="bar tail anim" x="525" y="211" width="46" height="24" rx="3"/>
      <g class="mean anim">
        <line x1="330" y1="58" x2="330" y2="235" stroke="#466b9e" stroke-dasharray="4 4"/>
        <text x="330" y="48" text-anchor="middle" font-size="12" fill="#466b9e">{{MEAN_LABEL}}</text>
      </g>
      <g class="p95 anim">
        <line x1="548" y1="78" x2="548" y2="235" stroke="#7951b0" stroke-dasharray="4 4"/>
        <text x="548" y="68" text-anchor="middle" font-size="12" fill="#7951b0">{{PERCENTILE_LABEL}}</text>
      </g>
      <text x="55" y="270" font-size="11" fill="#617287">{{X_AXIS_LABEL}}</text>
    </svg>
    <p class="caption">{{CAPTION}}</p>
  </div>
</section>
</div>
