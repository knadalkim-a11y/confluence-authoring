<!--
PATTERN: line-reveal
Replace {{PREFIX}} with a unique alphanumeric-hyphen prefix.
Example data only. CSS + SVG, no JavaScript or external resources.
-->
<style>
.{{PREFIX}}{--ink:#172b43;--muted:#617287;--line:#dfe6ef;--blue:#326cce;--amber:#b66c22;display:block;width:100%;max-width:920px;margin:0 auto;color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif}
.{{PREFIX}} *{box-sizing:border-box}
.{{PREFIX}} .box{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.{{PREFIX}} .head{padding:22px 24px 12px}
.{{PREFIX}} h3,.{{PREFIX}} p{margin:0}
.{{PREFIX}} .head p{margin-top:6px;color:var(--muted);font-size:13px}
.{{PREFIX}} .state{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important}
.{{PREFIX}} .tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 14px}
.{{PREFIX}} .tools label{border:1px solid #d7e0ec;border-radius:8px;padding:7px 11px;font-size:12px;cursor:pointer;background:#fff}
.{{PREFIX}} .stage{padding:0 24px 20px}
.{{PREFIX}} svg{display:block;width:100%;height:auto;background:#f8fafc;border:1px solid #e7edf4;border-radius:12px}
.{{PREFIX}} .grid{stroke:#dfe7f0;stroke-width:1}
.{{PREFIX}} .trace{fill:none;stroke:var(--blue);stroke-width:3;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:760;stroke-dashoffset:0;--a:{{PREFIX}}-draw-a;--b:{{PREFIX}}-draw-b}
.{{PREFIX}} .focus{opacity:1;--a:{{PREFIX}}-focus-a;--b:{{PREFIX}}-focus-b}
.{{PREFIX}} .caption{margin-top:12px;color:var(--muted);font-size:12px;line-height:1.6}
.{{PREFIX}} .anim{animation-name:var(--a);animation-duration:10s;animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:both}
.{{PREFIX}} .replay:checked~.stage .anim{animation-name:var(--b)}
.{{PREFIX}} .pause:checked~.stage .anim{animation-play-state:paused!important}
.{{PREFIX}} .still:checked~.stage .anim{animation:none!important}
@keyframes {{PREFIX}}-draw-a{0%,6%{stroke-dashoffset:760}68%,96%{stroke-dashoffset:0}100%{stroke-dashoffset:760}}
@keyframes {{PREFIX}}-draw-b{0%,6%{stroke-dashoffset:760}68%,96%{stroke-dashoffset:0}100%{stroke-dashoffset:760}}
@keyframes {{PREFIX}}-focus-a{0%,48%{opacity:0}56%,96%{opacity:1}100%{opacity:0}}
@keyframes {{PREFIX}}-focus-b{0%,48%{opacity:0}56%,96%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.{{PREFIX}} .anim{animation:none!important}.{{PREFIX}} .tools{display:none}}
@media print{.{{PREFIX}} .anim{animation:none!important}.{{PREFIX}} .tools{display:none}}
</style>
<div class="{{PREFIX}}" lang="ko">
<section class="box">
  <div class="head">
    <h3>{{TITLE}}</h3>
    <p>{{DESCRIPTION}}</p>
  </div>
  <input class="state pause" id="{{PREFIX}}-pause" type="checkbox" aria-label="애니메이션 일시정지">
  <input class="state replay" id="{{PREFIX}}-replay" type="checkbox" aria-label="애니메이션 처음부터 다시 재생">
  <input class="state still" id="{{PREFIX}}-still" type="checkbox" aria-label="최종 장면 표시">
  <div class="tools">
    <label for="{{PREFIX}}-pause">일시정지 / 계속</label>
    <label for="{{PREFIX}}-replay">처음부터</label>
    <label for="{{PREFIX}}-still">최종 장면</label>
  </div>
  <div class="stage">
    <svg viewBox="0 0 720 270" role="img" aria-labelledby="{{PREFIX}}-title">
      <title id="{{PREFIX}}-title">{{ACCESSIBLE_DESCRIPTION}}</title>
      <line class="grid" x1="55" y1="220" x2="690" y2="220"/>
      <line class="grid" x1="55" y1="160" x2="690" y2="160"/>
      <line class="grid" x1="55" y1="100" x2="690" y2="100"/>
      <text x="18" y="224" font-size="11" fill="#617287">0</text>
      <text x="8" y="164" font-size="11" fill="#617287">500</text>
      <text x="2" y="104" font-size="11" fill="#617287">1000</text>
      <polyline class="trace anim" points="55,205 95,203 135,204 175,201 215,203 255,200 295,196 335,185 375,168 415,145 455,120 495,103 535,92 575,80 615,71 655,64 690,60"/>
      <g class="focus anim">
        <line x1="335" y1="42" x2="335" y2="220" stroke="#b66c22" stroke-dasharray="4 4"/>
        <text x="345" y="58" font-size="12" fill="#9a5b1d">{{CHANGE_LABEL}}</text>
      </g>
    </svg>
    <p class="caption">{{CAPTION}}</p>
  </div>
</section>
</div>
