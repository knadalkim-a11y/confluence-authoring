<!--
PATTERN: sequential-flow
Replace {{PREFIX}} with a unique alphanumeric-hyphen prefix.
Use sourced step labels and states. CSS only, no JavaScript or external resources.
-->
<style>
.{{PREFIX}}{--ink:#172b43;--muted:#617287;--line:#dfe6ef;--blue:#326cce;--green:#277657;--amber:#a8681d;display:block;width:100%;max-width:1040px;margin:0 auto;color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans CJK KR",sans-serif}
.{{PREFIX}} *{box-sizing:border-box}
.{{PREFIX}} .box{border:1px solid var(--line);border-radius:16px;background:#fff;overflow:hidden}
.{{PREFIX}} .head{padding:22px 24px 12px}
.{{PREFIX}} h3,.{{PREFIX}} p{margin:0}
.{{PREFIX}} .head p{margin-top:6px;color:var(--muted);font-size:13px}
.{{PREFIX}} .state{position:absolute!important;width:1px!important;height:1px!important;overflow:hidden!important;clip:rect(0,0,0,0)!important}
.{{PREFIX}} .tools{display:flex;gap:8px;flex-wrap:wrap;padding:0 24px 14px}
.{{PREFIX}} .tools label{border:1px solid #d7e0ec;border-radius:8px;padding:7px 11px;font-size:12px;cursor:pointer;background:#fff}
.{{PREFIX}} .stage{padding:0 24px 22px}
.{{PREFIX}} .flow{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.{{PREFIX}} .node{position:relative;min-height:130px;padding:15px;border:1px solid #dce4ee;border-radius:12px;background:#f8fafc;--a:{{PREFIX}}-n1a;--b:{{PREFIX}}-n1b}
.{{PREFIX}} .node:after{content:"";position:absolute;right:-15px;top:38px;width:14px;height:1px;background:#bbc9d9}
.{{PREFIX}} .node:last-child:after{display:none}
.{{PREFIX}} .node b{display:block;margin-bottom:5px}
.{{PREFIX}} .node small{color:var(--muted);line-height:1.5}
.{{PREFIX}} .n2{--a:{{PREFIX}}-n2a;--b:{{PREFIX}}-n2b}
.{{PREFIX}} .n3{--a:{{PREFIX}}-n3a;--b:{{PREFIX}}-n3b}
.{{PREFIX}} .n4{--a:{{PREFIX}}-n4a;--b:{{PREFIX}}-n4b}
.{{PREFIX}} .gate{margin-top:14px;padding:11px 13px;border:1px solid #e4d1b3;border-radius:10px;background:#fff8ed;color:#7c521c}
.{{PREFIX}} .anim{animation-name:var(--a);animation-duration:12s;animation-timing-function:linear;animation-iteration-count:infinite;animation-fill-mode:both}
.{{PREFIX}} .replay:checked~.stage .anim{animation-name:var(--b)}
.{{PREFIX}} .pause:checked~.stage .anim{animation-play-state:paused!important}
.{{PREFIX}} .still:checked~.stage .anim{animation:none!important}
@keyframes {{PREFIX}}-n1a{0%,2%{background:#f8fafc;border-color:#dce4ee}4%,22%{background:#edf4ff;border-color:#77a0dd}26%,100%{background:#f3faf6;border-color:#bdd8c9}}
@keyframes {{PREFIX}}-n1b{0%,2%{background:#f8fafc;border-color:#dce4ee}4%,22%{background:#edf4ff;border-color:#77a0dd}26%,100%{background:#f3faf6;border-color:#bdd8c9}}
@keyframes {{PREFIX}}-n2a{0%,24%{background:#f8fafc;border-color:#dce4ee}28%,45%{background:#edf4ff;border-color:#77a0dd}50%,100%{background:#f3faf6;border-color:#bdd8c9}}
@keyframes {{PREFIX}}-n2b{0%,24%{background:#f8fafc;border-color:#dce4ee}28%,45%{background:#edf4ff;border-color:#77a0dd}50%,100%{background:#f3faf6;border-color:#bdd8c9}}
@keyframes {{PREFIX}}-n3a{0%,48%{background:#f8fafc;border-color:#dce4ee}52%,69%{background:#edf4ff;border-color:#77a0dd}74%,100%{background:#f3faf6;border-color:#bdd8c9}}
@keyframes {{PREFIX}}-n3b{0%,48%{background:#f8fafc;border-color:#dce4ee}52%,69%{background:#edf4ff;border-color:#77a0dd}74%,100%{background:#f3faf6;border-color:#bdd8c9}}
@keyframes {{PREFIX}}-n4a{0%,72%{background:#f8fafc;border-color:#dce4ee}77%,100%{background:#fff8ed;border-color:#d8b77f}}
@keyframes {{PREFIX}}-n4b{0%,72%{background:#f8fafc;border-color:#dce4ee}77%,100%{background:#fff8ed;border-color:#d8b77f}}
@media(max-width:720px){.{{PREFIX}} .flow{grid-template-columns:1fr 1fr}.{{PREFIX}} .node:after{display:none}}
@media (prefers-reduced-motion:reduce){.{{PREFIX}} .anim{animation:none!important}.{{PREFIX}} .tools{display:none}}
@media print{.{{PREFIX}} .anim{animation:none!important}.{{PREFIX}} .tools{display:none}}
</style>
<div class="{{PREFIX}}" lang="ko">
<section class="box">
  <div class="head"><h3>{{TITLE}}</h3><p>{{DESCRIPTION}}</p></div>
  <input class="state pause" id="{{PREFIX}}-pause" type="checkbox" aria-label="애니메이션 일시정지">
  <input class="state replay" id="{{PREFIX}}-replay" type="checkbox" aria-label="애니메이션 처음부터 다시 재생">
  <input class="state still" id="{{PREFIX}}-still" type="checkbox" aria-label="최종 장면 표시">
  <div class="tools">
    <label for="{{PREFIX}}-pause">일시정지 / 계속</label>
    <label for="{{PREFIX}}-replay">처음부터</label>
    <label for="{{PREFIX}}-still">최종 장면</label>
  </div>
  <div class="stage">
    <div class="flow" role="list" aria-label="{{ACCESSIBLE_DESCRIPTION}}">
      <div class="node n1 anim" role="listitem"><b>01 · {{STEP1_TITLE}}</b><small>{{STEP1_DESCRIPTION}}</small></div>
      <div class="node n2 anim" role="listitem"><b>02 · {{STEP2_TITLE}}</b><small>{{STEP2_DESCRIPTION}}</small></div>
      <div class="node n3 anim" role="listitem"><b>03 · {{STEP3_TITLE}}</b><small>{{STEP3_DESCRIPTION}}</small></div>
      <div class="node n4 anim" role="listitem"><b>04 · {{STEP4_TITLE}}</b><small>{{STEP4_DESCRIPTION}}</small></div>
    </div>
    <div class="gate"><strong>{{GATE_TITLE}}</strong> {{GATE_DESCRIPTION}}</div>
  </div>
</section>
</div>
