<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Confluence Authoring · Motion Library</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f4f7fb;color:#172b43;font:14px/1.6 "Malgun Gothic","Apple SD Gothic Neo",sans-serif}header.hero{background:#fff;border-bottom:1px solid #dce5ef;padding:28px max(20px,calc((100vw - 1280px)/2))}.eyebrow{font-size:11px;letter-spacing:1px;font-weight:700;color:#326cce}.hero h1{font-size:29px;margin:6px 0;letter-spacing:-.8px}.hero p{color:#586e85;margin:0}main{max-width:1320px;margin:0 auto;padding:22px;display:grid;grid-template-columns:270px minmax(0,1fr);gap:22px}aside{position:sticky;top:18px;align-self:start;background:#fff;border:1px solid #dce5ef;border-radius:14px;padding:16px;max-height:90vh;overflow:auto}input,select,button,textarea{font:inherit}input,select{display:block;width:100%;min-height:42px;border:1px solid #cbd8e7;border-radius:8px;padding:8px 10px;margin:6px 0 12px}label{font-size:12px;color:#415d78}button{cursor:pointer;border:1px solid #cbd8e7;border-radius:9px;padding:10px 13px;background:#fff;color:#294e7c;min-height:42px}button:hover{background:#edf4ff}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #81a7dd;outline-offset:2px}.items{display:grid;gap:7px}.items button{text-align:left;width:100%}.items button[aria-pressed=true]{border-color:#7099d0;background:#edf4ff}.items small{display:block;color:#586e85;font-size:11px}.panel{min-width:0}.selection-meta{background:#fff;border:1px solid #dce5ef;border-radius:12px;padding:17px 20px}.selection-meta h2{margin:0;font-size:19px}.selection-meta p{margin:5px 0;color:#586e85;font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.count{font-size:11px;color:#586e85;margin:10px 0}.source{display:none;margin-top:14px}.source.open{display:block}textarea{width:100%;height:300px;resize:vertical;font:12px/1.6 monospace;border:1px solid #cbd8e7;border-radius:10px;padding:12px}.notice{background:#fff7e8;border-left:3px solid #ac7538;padding:12px 15px;margin:18px}.empty{font-size:13px;color:#586e85}.footer{font-size:12px;color:#586e85;margin-top:18px}.preview>section{margin:14px 0!important}
@media(max-width:800px){main{grid-template-columns:1fr;padding:14px}aside{position:static;max-height:none}.items{grid-template-columns:repeat(auto-fit,minmax(160px,1fr))}.hero h1{font-size:24px}}@media print{aside,.toolbar,.source,.hero{display:none}main{display:block;padding:0}.selection-meta{border:0}}
</style></head><body>
<header class="hero"><div class="eyebrow">CONFLUENCE AUTHORING / 0.2</div><h1>설명 목적에 맞는 움직임</h1><p>13개 패턴 · 선택한 하나만 재생 · 원본과 같은 렌더러로 생성 · 예시 데이터</p></header>
<p id="setup" class="notice">저장소에서 처음 실행할 때: <code>python scripts/build_gallery.py</code>를 실행하세요. 결과는 <code>dist/gallery.html</code>이며 서버 없이 열 수 있습니다.</p>
<main><aside><label for="search">패턴 검색</label><input id="search" type="search" placeholder="예: 병렬, 승인, 대기열" autocomplete="off"><label for="category">설명 목적</label><select id="category"><option value="all">전체</option><option value="change">변화·추세</option><option value="comparison">비교</option><option value="process">절차·진행</option><option value="system">시스템</option><option value="cause-effect">원인·영향</option><option value="data">데이터</option></select><p id="count" class="count" aria-live="polite"></p><nav class="items" aria-label="모션 패턴" id="items"></nav></aside>
<section class="panel"><div id="metadata" class="selection-meta"></div><div id="preview" class="preview"></div><div id="source" class="source"><label for="code">이 예시의 Confluence HTML 매크로 코드</label><textarea id="code" readonly spellcheck="false"></textarea></div><p id="feedback" role="status"></p><p class="footer">갤러리 UI에만 JavaScript를 사용합니다. 생성된 매크로에는 JavaScript·외부 요청·공통 파일 의존성이 없습니다. 실제 Confluence 게시 검증은 별도입니다.</p></section></main>
<!-- BUILD_DATA -->
<script>
(()=>{'use strict';const data=window.CA_GALLERY;if(!data)return;document.getElementById('setup').hidden=true;const $=id=>document.getElementById(id);let current=null;let shown=data;function filter(){const q=$('search').value.trim().toLowerCase(),cat=$('category').value;shown=data.filter(x=>(cat==='all'||x.category===cat)&&[x.id,x.title,x.best_for].join(' ').toLowerCase().includes(q));$('items').replaceChildren();$('count').textContent=shown.length+' / '+data.length+'개 패턴';for(const item of shown){const b=document.createElement('button');b.type='button';b.dataset.id=item.id;b.setAttribute('aria-pressed',String(item===current));const title=document.createElement('span');title.textContent=item.title;const id=document.createElement('small');id.textContent=item.id;b.append(title,id);b.addEventListener('click',()=>select(item));$('items').append(b)}if(!shown.length){const p=document.createElement('p');p.className='empty';p.textContent='검색 결과가 없습니다. 검색어나 분류를 바꿔보세요.';$('items').append(p)}}function select(item){current=item;$('preview').innerHTML=item.html;$('code').value=item.html;$('feedback').textContent='';$('source').classList.remove('open');const title=document.createElement('h2');title.textContent=item.title;const p=document.createElement('p');p.textContent='사용: '+item.best_for.join(' · ');const avoid=document.createElement('p');avoid.textContent='주의: '+item.avoid_when.join(' · ');const tools=document.createElement('div');tools.className='toolbar';const source=document.createElement('button');source.textContent='매크로 코드 보기';source.type='button';source.onclick=()=>{$('source').classList.toggle('open')};const copy=document.createElement('button');copy.textContent='매크로 코드 복사';copy.type='button';copy.onclick=async()=>{try{if(!navigator.clipboard)throw Error('clipboard');await navigator.clipboard.writeText(item.html);$('feedback').textContent='예시 코드가 복사됐습니다. 같은 페이지에 재사용할 때는 고유 prefix를 새로 생성하세요.'}catch(e){$('source').classList.add('open');$('code').focus();$('code').select();$('feedback').textContent='브라우저가 자동 복사를 허용하지 않습니다. 선택된 코드를 Ctrl+C로 복사하세요.'}};tools.append(source,copy);$('metadata').replaceChildren(title,p,avoid,tools);filter()}$('search').addEventListener('input',filter);$('category').addEventListener('change',filter);select(data[0]);})();
</script></body></html>
